name: Publish to MCP Registry

# The interactive `mcp-publisher login github` flow cannot read GitHub organization
# roles, so an org namespace (io.github.ad-vertly/*) can only be published from
# Actions over OIDC, or with a classic PAT that has read:org.

on:
  workflow_dispatch:
  push:
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for GitHub OIDC namespace verification
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Authenticate with the registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish
        run: mcp-publisher publish
