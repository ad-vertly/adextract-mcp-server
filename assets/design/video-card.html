<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: url('file:///Users/gaurav.singh/Library/Fonts/Outfit%5Bwght%5D.ttf') format('truetype');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('file:///Users/gaurav.singh/Library/Fonts/IBMPlexSans%5Bwdth,wght%5D.ttf') format('truetype');
    font-weight: 100 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: #ffffff;
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }

  .card {
    width: 1080px; border: 2px solid #e2e8f0; border-radius: 28px;
    background: #ffffff; overflow: hidden;
    box-shadow: 0 24px 60px rgba(15,23,42,0.10);
  }

  .thumb { position: relative; width: 100%; height: 608px; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .play svg { width: 52px; height: 52px; margin-left: 6px; }

  .bar {
    display: flex; align-items: center; gap: 20px; padding: 26px 32px;
    background: #ffffff;
  }
  .bar .logo { width: 52px; height: 52px; flex: none; }
  .bar .text { flex: 1; }
  .bar .t1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 30px; color: #0f172a; }
  .bar .t2 { font-size: 18px; color: #64748b; margin-top: 2px; }
  .bar .watch {
    background: #7c5ce7; color: #ffffff; font-weight: 600; font-size: 19px;
    padding: 14px 28px; border-radius: 14px; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="thumb">
      <img src="file:///tmp/adextract-repo-assets/video-thumb-max.jpg" />
      <div class="play">
        <svg viewBox="0 0 24 24"><path fill="#7c5ce7" d="M8 5.14v13.72c0 .88.96 1.42 1.71.96l10.7-6.86a1.13 1.13 0 000-1.92L9.71 4.18A1.13 1.13 0 008 5.14z"/></svg>
      </div>
    </div>
    <div class="bar">
      <img class="logo" src="file:///tmp/adextract-repo-assets/adextract-logo.png" />
      <div class="text">
        <div class="t1">ad intelligence for AI agents</div>
        <div class="t2">Watch the 30-second demo · Search · Read · Compare</div>
      </div>
      <div class="watch">Watch on YouTube</div>
    </div>
  </div>
</body>
</html>
